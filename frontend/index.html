<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - ORM Backend</title>
    <style>
        /* Estilos Generales */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            min-height: 100vh;
        }

        /* Barra Lateral (Sidebar) */
        .sidebar {
            width: 250px;
            background-color: #1e293b;
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            font-size: 1.4rem;
            margin-bottom: 30px;
            color: #38bdf8;
            text-align: center;
        }

        .sidebar nav a {
            color: #94a3b8;
            text-decoration: none;
            padding: 12px 15px;
            display: block;
            border-radius: 6px;
            margin-bottom: 8px;
            transition: background 0.3s, color 0.3s;
        }

        .sidebar nav a:hover, .sidebar nav a.active {
            background-color: #334155;
            color: #fff;
        }

        /* Contenido Principal */
        .main-content {
            flex: 1;
            padding: 30px;
        }

        header {
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.8rem;
            color: #0f172a;
        }

        /* Layout en Grilla para Formulario y Tabla */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        /* Tarjetas (Cards) */
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin-bottom: 15px;
            color: #1e293b;
            font-size: 1.1rem;
        }

        /* Formularios */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #475569;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        /* Tablas */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table th, table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.9rem;
        }

        table th {
            background-color: #f8fafc;
            color: #475569;
        }

        .actions a {
            color: #2563eb;
            text-decoration: none;
            margin-right: 10px;
        }

        .actions a.delete {
            color: #ef4444;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navegación -->
    <aside class="sidebar">
        <h2>ORM Sistema</h2>
        <nav>
            <a href="#" class="active">Productos</a>
            <a href="#">Categorías</a>
            <a href="#">Entradas</a>
        </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="main-content">
        <header>
            <h1>Gestión de Productos</h1>
        </header>

        <div class="grid-container">
            <!-- Formulario de Registro -->
            <section class="card">
                <h3>Nuevo Producto</h3>
                <form id="productForm">
                    <div class="form-group">
                        <label for="nombre">Nombre del Producto</label>
                        <input type="text" id="nombre" placeholder="Ej. Teclado Mecánico" required>
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" required>
                            <option value="">Seleccione una categoría</option>
                            <option value="1">Electrónica</option>
                            <option value="2">Accesorios</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="precio">Precio ($)</label>
                        <input type="number" id="precio" step="0.01" placeholder="0.00" required>
                    </div>

                    <div class="form-group">
                        <label for="stock">Stock Inicial</label>
                        <input type="number" id="stock" placeholder="0" required>
                    </div>

                    <button type="submit" class="btn">Guardar Producto</button>
                </form>
            </section>

            <!-- Tabla de Listado -->
            <section class="card">
                <h3>Lista de Productos</h3>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Teclado Mecánico</td>
                            <td>Accesorios</td>
                            <td>$45.00</td>
                            <td>12</td>
                            <td class="actions">
                                <a href="#">Editar</a>
                                <a href="#" class="delete">Eliminar</a>
                            </td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Monitor 24"</td>
                            <td>Electrónica</td>
                            <td>$150.00</td>
                            <td>5</td>
                            <td class="actions">
                                <a href="#">Editar</a>
                                <a href="#" class="delete">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </main>

</body>
</html>
